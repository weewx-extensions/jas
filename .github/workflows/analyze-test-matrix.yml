name: Run analyze and test matrix

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  analyze-test:
    uses: weewx-extensions/development-tools/.github/workflows/analyze-test-matrix.yml@v6
    with:
      module-name: 'jas'
      #pip-list: 'paho-mqtt'
      #package-list: 'mosquitto'
      lint-paths: './bin/user/jas.py ./bin/user/jas_templates.py'
      # The chart building code has long standing structural findings; report them.
      lint-fail: false
      unit-test: true
      function-test: true
      integration-test: false
      e2e-test: false
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
